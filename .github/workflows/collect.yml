name: Collect Keirin Results

on:
  schedule:
    # 07:30 JST. GitHub Actions scheduled runs can be delayed during busy periods.
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      allow_fresh_db:
        description: "Allow publishing a new DB backup without restoring the previous artifact"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  collect:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    concurrency:
      group: collect-keirin-results
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Restore DB backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "DB_RESTORE_STATUS=missing" >> "$GITHUB_ENV"
          echo "DB_RESTORE_ARTIFACT_ID=" >> "$GITHUB_ENV"
          echo "DB_RESTORE_ARTIFACT_NAME=" >> "$GITHUB_ENV"
          artifact="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts" --paginate \
              --jq '.artifacts[] | select((.name == "keirin-db-backup" or .name == "keirin-db-core-backup") and .expired == false) | [.created_at, .id, .name] | @tsv' \
              | sort -r \
              | head -n 1 || true
          )"
          if [ -n "$artifact" ]; then
            created_at="$(echo "$artifact" | cut -f1)"
            artifact_id="$(echo "$artifact" | cut -f2)"
            artifact_name="$(echo "$artifact" | cut -f3)"
            echo "Restoring DB artifact ${artifact_name} (${artifact_id}) from ${created_at}."
            echo "DB_RESTORE_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
            echo "DB_RESTORE_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
            mkdir -p data
            restore_dir="data/.restore-db"
            rm -rf "$restore_dir"
            mkdir -p "$restore_dir"
            if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$restore_dir/db.zip"; then
              unzip -q "$restore_dir/db.zip" -d "$restore_dir"
              if [ -f "$restore_dir/keirin.db" ]; then
                mv "$restore_dir/keirin.db" data/keirin.db
                echo "DB_RESTORE_STATUS=restored" >> "$GITHUB_ENV"
              else
                echo "DB artifact downloaded but keirin.db was not found."
                echo "DB_RESTORE_STATUS=downloaded_without_db" >> "$GITHUB_ENV"
              fi
            else
              echo "DB artifact download failed; using repository DB if present."
              echo "DB_RESTORE_STATUS=download_failed" >> "$GITHUB_ENV"
            fi
            rm -rf "$restore_dir"
          fi
          if [ ! -f data/keirin.db ]; then
            mkdir -p data
            if gh release download keirin-db-bootstrap --pattern keirin.db --dir data; then
              echo "Restored DB from keirin-db-bootstrap release asset."
              echo "DB_RESTORE_STATUS=restored" >> "$GITHUB_ENV"
              echo "DB_RESTORE_ARTIFACT_NAME=keirin-db-bootstrap" >> "$GITHUB_ENV"
            else
              echo "No bootstrap release DB restored; using repository DB if present."
            fi
          fi
          test -f data/keirin.db || echo "No DB artifact restored; using repository DB if present."

      - name: Summarize DB before collection
        run: python -m src.db_guard summary --json-file db-guard-before.json

      - name: Collect results
        run: python -m src.scraper

      - name: Collect racecards
        run: python -m src.schedule

      - name: Build line features
        run: python -m src.lineup_features

      - name: Build entry features
        run: python -m src.entry_features

      - name: Build race risk features
        run: python -m src.race_risk_features

      - name: Validate DB backup continuity
        env:
          ALLOW_FRESH_DB: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_fresh_db || false }}
        run: |
          python -m src.db_guard summary --json-file db-guard-after-core.json
          args=""
          if [ "$ALLOW_FRESH_DB" = "true" ]; then
            args="--allow-fresh-db"
          fi
          python -m src.db_guard validate \
            --before db-guard-before.json \
            --after db-guard-after-core.json \
            --restore-status "$DB_RESTORE_STATUS" \
            $args \
            --json-file db-guard-validation.json \
            --env-file "$GITHUB_ENV" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload core DB backup
        if: env.DB_GUARD_OK == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: keirin-db-core-backup
          path: data/keirin.db
          retention-days: 30
          if-no-files-found: error

      - name: Generate predictions
        if: env.DB_GUARD_OK == 'true'
        env:
          SITE_ENV: ${{ vars.SITE_ENV }}
        run: python -m src.prediction

      - name: Export analytics pages
        if: env.DB_GUARD_OK == 'true'
        env:
          SITE_ENV: ${{ vars.SITE_ENV }}
        run: python -m src.analysis

      - name: Export public data
        if: env.DB_GUARD_OK == 'true'
        run: python -m src.export_public_data

      - name: Summarize final DB backup
        if: env.DB_GUARD_OK == 'true'
        run: python -m src.db_guard summary --json-file db-guard-after.json

      - name: Upload final DB backup
        if: env.DB_GUARD_OK == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: keirin-db-backup
          path: data/keirin.db
          retention-days: 30
          if-no-files-found: error

      - name: Prune old DB artifacts
        if: env.DB_GUARD_OK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts" --paginate \
            --jq '.artifacts[] | select((.name == "keirin-db-backup" or .name == "keirin-db-core-backup") and .expired == false) | [.created_at, .id, .name] | @tsv' \
            | sort -r \
            | tail -n +4 \
            | while IFS="$(printf '\t')" read -r created_at artifact_id artifact_name; do
                echo "Deleting old DB artifact ${artifact_name} (${artifact_id}) from ${created_at}."
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              done

      - name: Commit collected data
        if: env.DB_GUARD_OK == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Collect keirin race results"
          file_pattern: docs/*.html docs/.nojekyll docs/data/*.json docs/data/race_details/*.json

      - name: Upload DB guard diagnostics
        if: env.DB_GUARD_OK != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: keirin-db-guard-diagnostics
          path: |
            db-guard-before.json
            db-guard-after-core.json
            db-guard-validation.json
            logs/*.log
          retention-days: 14
          if-no-files-found: warn

      - name: Fail when DB backup is not safe to publish
        if: env.DB_GUARD_OK != 'true'
        run: |
          echo "DB guard blocked publishing keirin-db-backup. See job summary and diagnostics artifact."
          exit 1
