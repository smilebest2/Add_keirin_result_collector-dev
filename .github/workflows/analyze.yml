name: Analyze Keirin Results

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore DB backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --workflow "Collect Keirin Results" --branch main --status success --json databaseId --jq '.[0].databaseId' || true)"
          if [ -n "$run_id" ]; then
            mkdir -p data
            restore_dir="data/.restore-db"
            rm -rf "$restore_dir"
            mkdir -p "$restore_dir"
            if gh run download "$run_id" --name keirin-db-backup --dir "$restore_dir"; then
              if [ -f "$restore_dir/keirin.db" ]; then
                mv "$restore_dir/keirin.db" data/keirin.db
              else
                echo "DB artifact downloaded but keirin.db was not found."
              fi
            else
              echo "DB artifact download failed; using repository DB if present."
            fi
            rm -rf "$restore_dir"
          fi
          test -f data/keirin.db || echo "No DB artifact restored; using repository DB if present."

      - name: Build line features
        run: python -m src.lineup_features

      - name: Build entry features
        run: python -m src.entry_features

      - name: Build race risk features
        run: python -m src.race_risk_features

      - name: Evaluate predictions
        env:
          SITE_ENV: ${{ vars.SITE_ENV }}
        run: python -m src.prediction

      - name: Generate analytics pages
        env:
          SITE_ENV: ${{ vars.SITE_ENV }}
        run: python -m src.analysis

      - name: Export public data
        run: python -m src.export_public_data

      - name: Commit analytics pages
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update keirin analytics pages"
          file_pattern: docs/*.html docs/.nojekyll docs/data/*.json docs/data/race_details/*.json

      - name: Upload DB backup
        uses: actions/upload-artifact@v4
        with:
          name: keirin-db-backup
          path: data/keirin.db
          retention-days: 3
          if-no-files-found: error
