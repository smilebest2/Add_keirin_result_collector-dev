<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[DEV] サイコロ車券 | 競輪統計</title>
  <style>
    :root {
      --bg: #f5f7f9;
      --panel: #ffffff;
      --ink: #20242a;
      --muted: #697586;
      --line: #dbe1e8;
      --accent: #0f766e;
      --accent-2: #1d4ed8;
      --accent-3: #b45309;
      --soft: #e0f2ef;
      --soft-2: #e8eefc;
      --warn: #fef3c7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .env-banner {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #f59e0b;
      color: #111827;
      border-bottom: 1px solid #b45309;
      padding: 7px 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0;
    }
    body.is-dev header {
      border-top: 4px solid #f59e0b;
    }
    .wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 18px 20px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      letter-spacing: 0;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    nav a {
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      padding: 7px 10px;
      text-decoration: none;
      font-size: 14px;
      background: #fbfcfd;
    }
    nav a.active {
      border-color: var(--accent);
      background: var(--soft);
      color: var(--accent);
      font-weight: 700;
    }
    main .wrap {
      display: grid;
      gap: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      gap: 12px;
    }
    .grid.two {
      grid-template-columns: repeat(2, minmax(240px, 1fr));
    }
    .card, section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .card {
      overflow: hidden;
      padding: 14px;
    }
    section {
      overflow-x: auto;
    }
    .card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }
    .card strong {
      display: block;
      margin-top: 3px;
      font-size: 22px;
    }
    section h2 {
      margin: 0;
      padding: 13px 15px;
      border-bottom: 1px solid var(--line);
      font-size: 17px;
      background: #fafbfc;
      letter-spacing: 0;
    }
    .section-lead {
      margin: 12px 15px 0;
      color: var(--muted);
      font-size: 13px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }
    th {
      color: var(--muted);
      background: #fbfcfd;
      font-weight: 700;
    }
    .empty {
      padding: 22px;
      color: var(--muted);
      text-align: center;
    }
    .chart {
      display: grid;
      gap: 9px;
      padding: 14px 15px 16px;
    }
    .bar-row {
      display: grid;
      grid-template-columns: minmax(92px, 170px) minmax(160px, 1fr) 92px;
      gap: 10px;
      align-items: center;
      font-size: 13px;
    }
    .bar-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bar-track {
      height: 12px;
      border-radius: 999px;
      background: #eef2f6;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      min-width: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }
    .bar-value {
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
    }
    .result-graph-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }
    .line-chart {
      padding: 14px 15px 16px;
    }
    .line-chart svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
    .line-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .line-legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .line-legend i {
      display: inline-block;
      width: 18px;
      height: 3px;
      border-radius: 999px;
    }
    .dice-panel {
      display: grid;
      gap: 18px;
    }
    .dice-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      align-items: end;
    }
    .dice-controls label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .dice-controls select,
    .dice-controls input {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    .dice-button {
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      padding: 9px 16px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }
    .dice-button:hover {
      background: #0b615b;
    }
    .dice-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }
    .dice-summary div {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfcfd;
    }
    .dice-summary span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }
    .dice-summary strong {
      display: block;
      margin-top: 4px;
      font-size: 22px;
    }
    .dice-results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 8px;
    }
    .dice-ticket {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 8px;
      background: #fff;
      text-align: center;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .dice-note {
      color: var(--muted);
      font-size: 13px;
    }
    .heatmap {
      padding: 0 0 2px;
      overflow-x: auto;
    }
    .heatmap td {
      min-width: 58px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .heat-0 { background: #f8fafc; }
    .heat-1 { background: #e8f4f1; }
    .heat-2 { background: #cbe9e2; }
    .heat-3 { background: #94d6c8; }
    .heat-4 { background: #4eb7a2; color: #062f29; font-weight: 700; }
    .note {
      padding: 12px 15px;
      color: var(--muted);
      background: #fbfcfd;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }
    .inline-note {
      padding: 12px 15px;
      color: var(--muted);
      font-size: 13px;
      background: #fbfcfd;
      border-bottom: 1px solid var(--line);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px 15px 16px;
    }
    .operation-toggle {
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      text-align: left;
      padding: 0;
    }
    .operation-error {
      margin: 12px 15px 0;
      color: #b91c1c;
      font-size: 13px;
      font-weight: 700;
    }
    .operation-error:empty {
      display: none;
    }
    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #ffffff;
      padding: 8px 12px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }
    .action-button.secondary {
      border-color: #b91c1c;
      background: #b91c1c;
    }
    .detail-link {
      color: var(--accent-2);
      font-weight: 700;
      text-decoration: none;
    }
    .detail-link:hover {
      text-decoration: underline;
    }
    .rank-note {
      padding: 12px 15px;
      color: var(--muted);
      font-size: 13px;
      background: #fbfcfd;
      border-bottom: 1px solid var(--line);
    }
    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 8px;
      background: var(--soft-2);
      color: var(--accent-2);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .pill.warn {
      background: var(--warn);
      color: var(--accent-3);
    }
    .pill.low {
      background: #fee2e2;
      color: #991b1b;
    }
    .pill.ok {
      background: var(--soft);
      color: var(--accent);
    }
    .prediction-pick {
      display: grid;
      gap: 2px;
      min-width: 118px;
    }
    .prediction-pick strong {
      font-size: 14px;
      white-space: nowrap;
    }
    .prediction-pick span {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .prediction-pick.empty {
      color: var(--muted);
      min-width: 88px;
    }
    .prediction-type-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(160px, 1fr));
      gap: 10px;
      padding: 14px 15px 16px;
    }
    .prediction-type-note {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfcfd;
    }
    .prediction-type-note strong {
      display: block;
      margin-bottom: 4px;
    }
    .prediction-type-note span {
      color: var(--muted);
      font-size: 13px;
    }
    .decision-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 10px;
      padding: 14px 15px 0;
    }
    .decision-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfcfd;
    }
    .decision-card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .decision-card strong {
      display: block;
      margin-top: 4px;
      font-size: 22px;
      line-height: 1.15;
    }
    .decision-card small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }
    #daily-recommendations td:nth-child(8) {
      min-width: 260px;
      max-width: 520px;
      white-space: normal;
    }
    .compact-reason {
      max-width: 520px;
      color: var(--ink);
    }
    .compact-reason summary {
      cursor: pointer;
      color: var(--accent-2);
      font-weight: 700;
      list-style-position: inside;
    }
    .compact-reason div {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      white-space: normal;
    }
    .compact-components {
      min-width: 220px;
      max-width: 360px;
      white-space: normal;
    }
    .compact-components summary {
      cursor: pointer;
      color: var(--accent-2);
      font-weight: 700;
      list-style-position: inside;
    }
    .compact-components div {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      white-space: normal;
    }
    .analysis-compact-table td:nth-child(12),
    .analysis-compact-table td:nth-child(13) {
      min-width: 220px;
      max-width: 360px;
      white-space: normal;
    }
    .recommendation-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 15px 0;
      color: var(--muted);
      font-size: 13px;
    }
    .recommendation-toolbar strong {
      color: var(--ink);
    }
    .pill.buy {
      background: #dcfce7;
      color: #166534;
    }
    .pill.caution {
      background: #fef3c7;
      color: #92400e;
    }
    .result-focus {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 10px;
      padding: 14px 15px 0;
    }
    .result-focus .decision-card {
      background: #ffffff;
    }
    .result-focus .hit strong {
      color: #166534;
    }
    .result-focus .return strong {
      color: var(--accent);
    }
    .result-focus .miss strong {
      color: #991b1b;
    }
    .analysis-fold {
      margin-top: 16px;
    }
    .analysis-fold > summary {
      cursor: pointer;
      padding: 13px 15px;
      color: var(--accent);
      font-weight: 800;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
    }
    tr.sample-low td {
      opacity: 0.48;
      background: #f8fafc;
    }
    tr.sample-low td:first-child::after {
      content: " 参考";
      color: var(--accent-3);
      font-size: 11px;
      font-weight: 700;
    }
    tr.analysis-selected td {
      background: #e8f1f8;
    }
    .analysis-dashboard {
      display: grid;
      gap: 14px;
      padding: 14px 15px 16px;
    }
    .analysis-metrics {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px;
    }
    .analysis-metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfcfd;
    }
    .analysis-metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .analysis-metric strong {
      font-size: 20px;
    }
    .analysis-panels {
      display: grid;
      grid-template-columns: repeat(2, minmax(260px, 1fr));
      gap: 14px;
    }
    .analysis-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #ffffff;
      min-width: 0;
    }
    .analysis-panel h3 {
      margin: 0 0 10px;
      font-size: 15px;
    }
    .analysis-bars {
      display: grid;
      gap: 8px;
    }
    .analysis-bar-row {
      display: grid;
      grid-template-columns: minmax(92px, 150px) 1fr minmax(54px, auto);
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }
    .analysis-bar-track {
      height: 9px;
      border-radius: 999px;
      background: #edf1f4;
      overflow: hidden;
    }
    .analysis-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
    }
    .analysis-ranking {
      display: grid;
      gap: 7px;
    }
    .analysis-rank-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 9px;
      background: #fbfcfd;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .analysis-rank-item span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }
    .analysis-scatter {
      position: relative;
      height: 260px;
      border-left: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(#eef2f5 1px, transparent 1px),
        linear-gradient(90deg, #eef2f5 1px, transparent 1px);
      background-size: 100% 25%, 25% 100%;
      margin: 6px 4px 20px 22px;
    }
    .analysis-point {
      position: absolute;
      transform: translate(-50%, 50%);
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 0;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(29, 78, 116, 0.24);
    }
    .analysis-point.verdict-strong { background: var(--accent-2); }
    .analysis-point.verdict-weak { background: var(--accent-3); }
    .analysis-point.verdict-watch { background: #8a6d3b; }
    .analysis-axis-note {
      color: var(--muted);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: -12px;
    }
    .analysis-detail-toggle {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }
    .analysis-detail-toggle summary {
      cursor: pointer;
      padding: 12px 14px;
      font-weight: 700;
      color: var(--accent);
      background: #fbfcfd;
    }
    .analysis-detail-toggle .section-lead {
      padding: 0 14px 10px;
    }
    .filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(130px, 1fr));
      gap: 10px;
      padding: 14px 15px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
    }
    .filters label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .filters input, .filters select {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 9px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
    }
    .filters .check {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 20px;
    }
    .filters .check input {
      min-height: 0;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .toolbar label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .toolbar input {
      min-height: 38px;
      min-width: min(360px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
    }
    .racer-filter-panel {
      display: grid;
      gap: 12px;
    }
    .racer-filter-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 10px;
    }
    .racer-filter-grid label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .racer-filter-grid select {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 9px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
    }
    .kana-filter {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .kana-filter button {
      min-height: 32px;
      min-width: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
    }
    .kana-filter button.active {
      border-color: var(--accent);
      background: var(--soft);
      color: var(--accent);
    }
    .selected-racer-control {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
    }
    .selected-racer-control strong {
      color: var(--ink);
    }
    .selected-racer-control button {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: var(--accent);
      font-weight: 700;
      cursor: pointer;
      padding: 6px 10px;
    }
    .racer-search-table tbody tr {
      cursor: pointer;
    }
    .hit {
      color: var(--accent);
      font-weight: 700;
    }
    .miss {
      color: #b91c1c;
      font-weight: 700;
    }
    .ranking-more {
      border-top: 1px solid var(--line);
    }
    .ranking-more summary {
      cursor: pointer;
      padding: 11px 15px;
      color: var(--accent-2);
      font-size: 13px;
      font-weight: 700;
      background: #fbfcfd;
      list-style-position: inside;
    }
    @media (max-width: 780px) {
      .grid, .grid.two { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      section { overflow-x: auto; }
      table { min-width: 760px; }
      .bar-row { grid-template-columns: 96px minmax(130px, 1fr) 74px; }
      .filters { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      .decision-grid { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      .result-focus { grid-template-columns: 1fr; }
      .prediction-type-grid { grid-template-columns: 1fr; }
      .analysis-metrics { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      .analysis-panels { grid-template-columns: 1fr; }
      .analysis-bar-row { grid-template-columns: 96px minmax(120px, 1fr) 58px; }
      .analysis-scatter { min-width: 520px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body class="is-dev">
  <div class="env-banner">DEV環境</div>
  <header>
    <div class="wrap">
      <h1>サイコロ車券</h1>
      <nav><a class="" href="index.html">TOP</a><a class="" href="venues.html">会場分析</a><a class="" href="car_numbers.html">車番分析</a><a class="" href="outcomes.html">出目分析</a><a class="" href="payouts.html">配当分析</a><a class="" href="racers.html">選手分析</a><a class="" href="predictions.html">予想</a><a class="" href="prediction-results.html">予想結果</a><a class="" href="lineup-features.html">ライン解析</a><a class="active" href="dice-bets.html">サイコロ車券</a><a class="" href="races.html">レース一覧</a><a class="" href="quality.html">データ品質</a><a class="" href="custom.html">独自ランキング</a></nav>
    </div>
  </header>
  <main>
    <div class="wrap">

    <section>
      <h2>サイコロ車券</h2>
      <div class="dice-panel" id="dice-bets">
        <div class="dice-controls">
          <label>車立て
            <select id="dice-car-count">
              <option value="5">5車</option>
              <option value="6">6車</option>
              <option value="7" selected>7車</option>
              <option value="8">8車</option>
              <option value="9">9車</option>
            </select>
          </label>
          <label>買い目数
            <input id="dice-ticket-count" type="number" min="5" max="100" value="10">
          </label>
          <label>賭式
            <select id="dice-bet-type">
              <option value="wide">ワイド</option>
              <option value="two_pair">2車複</option>
              <option value="two_exact">2車単</option>
              <option value="trio">3連複</option>
              <option value="trifecta" selected>3連単</option>
            </select>
          </label>
          <button class="dice-button" id="dice-roll" type="button">サイコロを振る</button>
        </div>
        <div class="dice-summary" id="dice-summary" aria-live="polite"></div>
        <div class="dice-note" id="dice-note"></div>
        <div class="dice-results" id="dice-results"></div>
      </div>
    </section>
    <script>
    (() => {
      const carCount = document.getElementById("dice-car-count");
      const ticketCount = document.getElementById("dice-ticket-count");
      const betType = document.getElementById("dice-bet-type");
      const roll = document.getElementById("dice-roll");
      const summary = document.getElementById("dice-summary");
      const note = document.getElementById("dice-note");
      const results = document.getElementById("dice-results");

      const labels = {
        wide: "ワイド",
        two_pair: "2車複",
        two_exact: "2車単",
        trio: "3連複",
        trifecta: "3連単"
      };

      const cars = (count) => Array.from({ length: count }, (_, index) => index + 1);
      const comboText = (combo, type) => {
        if (type === "two_exact" || type === "trifecta") return combo.join("-");
        return combo.join("=");
      };
      const sortCombos = (items) => items.sort((a, b) => {
        for (let i = 0; i < Math.max(a.length, b.length); i += 1) {
          const diff = (a[i] || 0) - (b[i] || 0);
          if (diff) return diff;
        }
        return 0;
      });
      const shuffle = (items) => {
        const copy = [...items];
        for (let i = copy.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      };

      const allCombos = (count, type) => {
        const ns = cars(count);
        const combos = [];
        if (type === "wide" || type === "two_pair") {
          for (let i = 0; i < ns.length; i += 1) {
            for (let j = i + 1; j < ns.length; j += 1) combos.push([ns[i], ns[j]]);
          }
        } else if (type === "two_exact") {
          ns.forEach((a) => ns.forEach((b) => { if (a !== b) combos.push([a, b]); }));
        } else if (type === "trio") {
          for (let i = 0; i < ns.length; i += 1) {
            for (let j = i + 1; j < ns.length; j += 1) {
              for (let k = j + 1; k < ns.length; k += 1) combos.push([ns[i], ns[j], ns[k]]);
            }
          }
        } else if (type === "trifecta") {
          ns.forEach((a) => ns.forEach((b) => ns.forEach((c) => {
            if (a !== b && a !== c && b !== c) combos.push([a, b, c]);
          })));
        }
        return combos;
      };

      const render = () => {
        const count = Number(carCount.value);
        const requested = Math.max(5, Math.min(100, Number(ticketCount.value || 5)));
        ticketCount.value = requested;
        const type = betType.value;
        const pool = allCombos(count, type);
        const generated = Math.min(requested, pool.length);
        const picked = sortCombos(shuffle(pool).slice(0, generated));

        summary.innerHTML = [
          ["賭式", labels[type]],
          ["指定", `${requested}点`],
          ["生成", `${generated}点`],
          ["合計", `${(generated * 100).toLocaleString("ja-JP")}円`]
        ].map(([label, value]) => `<div><span>${label}</span><strong>${value}</strong></div>`).join("");
        note.textContent = requested > pool.length
          ? `${count}車 / ${labels[type]} の最大点数は ${pool.length}点です。`
          : "";
        results.innerHTML = picked.map((combo) => `<div class="dice-ticket">${comboText(combo, type)}</div>`).join("");
      };

      roll.addEventListener("click", render);
      [carCount, ticketCount, betType].forEach((item) => item.addEventListener("change", render));
      render();
    })();
    </script>

    </div>
  </main>
  <script>
    (() => {
      const toggle = document.querySelector("[data-operation-toggle]");
      const actions = document.querySelector("[data-operation-actions]");
      const error = document.querySelector("[data-operation-error]");
      if (!toggle || !actions) return;

      toggle.addEventListener("click", () => {
        const password = window.prompt("パスワードを入力してください");
        if (password === "0415") {
          actions.hidden = false;
          toggle.setAttribute("aria-expanded", "true");
          if (error) error.textContent = "";
          return;
        }
        if (error) error.textContent = "パスワードが違います。";
      });
    })();
  </script>
</body>
</html>
